name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# a newer push to the same branch cancels the older build still running
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create Releases with the default GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci
        env:
          EXPO_NO_TELEMETRY: 1

      # /android is gitignored, so CI regenerates it every build
      - name: Generate native Android project
        run: npx expo prebuild -p android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # release variant bundles the JS (a debug APK would boot to the
      # dev-client launcher and need Metro from a PC). The template's
      # release buildType is signed with the auto-generated debug.keystore,
      # so the APK is installable as-is. arm64+armv7 covers every real phone;
      # x86 ABIs (emulator-only) are skipped to keep the build fast.
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkvault-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish to Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
